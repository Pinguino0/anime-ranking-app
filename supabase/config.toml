project_id = "sjbstiexythmapxmrfyp"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["animerank://auth-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "5MiB"

[realtime]
enabled = true

# ----------------------------------------------------------------------------
# send-push
# ----------------------------------------------------------------------------
# `verify_jwt = false` perche' l'autorizzazione la fa la funzione stessa: la
# chiama solo il Database Webhook su `notifications`, con la SERVICE ROLE KEY
# nell'header `Authorization`. Il gateway di Supabase non deve entrare nel
# merito, e cosi' anche `/health` resta raggiungibile per capire se la funzione
# e' configurata. Vedi `functions/send-push/index.ts`, `isAuthorized`.
[functions.send-push]
verify_jwt = false
