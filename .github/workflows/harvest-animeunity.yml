name: AnimeUnity sitemap-diff (settimanale)

# Scarica la sitemap di AnimeUnity e, facendo il diff con gli id gia' presenti in
# `provider_anime_index`, importa SOLO i record nuovi. `harvest_animeunity.js`
# e' gia' ripartibile (salta gli id presenti), quindi la cadenza settimanale e'
# di per se' il "diff". Non richiede dipendenze npm: usa solo `fetch` di Node.
#
# Richiede i secret di repository:
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY

on:
  schedule:
    # lunedi' 03:17 UTC (fuori dai picchi orari di GitHub Actions)
    - cron: '17 3 * * 1'
  workflow_dispatch: {}

concurrency:
  group: harvest-animeunity
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Diff sitemap e import nuovi record AnimeUnity
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node seed/harvest_animeunity.js
