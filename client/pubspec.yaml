name: animerank
description: "A new Flutter project."
publish_to: 'none'
version: 0.0.18+18

environment:
  sdk: ^3.13.4

dependencies:
  cached_network_image: ^4.0.4
  connectivity_plus: ^7.3.1
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.5
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  hive_ce: ^2.20.1
  hive_ce_flutter: ^2.4.0
  # Scelta della foto profilo. Lo stesso pacchetto copre Android, iOS e
  # Windows (su desktop e' un wrapper di file_selector): il codice non deve
  # scegliere il canale giusto per piattaforma.
  image_picker: ^1.2.4
  intl: ^0.20.3
  # Player con header HTTP e supporto HLS nativo.
  #
  # Sostituisce `video_player` perche' le fonti non sono URL diretti stabili:
  # sono indirizzi canonici che vanno risolti dal provider e restituiscono
  # token ed header (Referer, Authorization, cookie). `video_player` non ha un
  # modo di passare header, quindi con le fonti risolte il player aprirebbe
  # il video e il CDN risponderebbe 403. `media_kit` accetta `httpHeaders` su
  # `Media`, che e' esattamente il dato che arriva da `resolve-source`.
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  ota_update: ^7.1.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.18.0
  url_launcher: ^6.3.2
  flutter_local_notifications: ^22.0.0
  workmanager: ^0.10.10
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  cronet_http: ^1.10.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Genera le icone del launcher dal file indicato. Non entra nella build: si
# lancia a mano (`dart run flutter_launcher_icons`) ogni volta che il disegno
# cambia, e scrive i PNG nelle mipmap di Android e nell'asset catalog di iOS.
flutter_launcher_icons:
  android: true
  # Anche iOS: l'app gira pure su iPhone. Apple rifiuta le icone con canale
  # alpha, quindi il canale viene tolto in generazione.
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  # L'emblema e' a piena copertura con sfondo scuro: come sfondo dell'icona
  # adattiva si usa lo stesso nero dell'app, cosi' il ritaglio del launcher non
  # scopre un colore estraneo.
  adaptive_icon_background: "#05050A"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true

  fonts:
    # Google Fonts distribuisce ormai solo file variabili: un unico .ttf copre
    # tutti i pesi. Flutter non ricava il peso da solo, quindi ogni peso e'
    # dichiarato come voce separata e applicato via `fontVariations` nel tema.
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVar.ttf
        - asset: assets/fonts/InterVar.ttf
          weight: 400
        - asset: assets/fonts/InterVar.ttf
          weight: 500
        - asset: assets/fonts/InterVar.ttf
          weight: 600
        - asset: assets/fonts/InterVar.ttf
          weight: 700
        - asset: assets/fonts/InterVar.ttf
          weight: 800
    # Display: titoli grandi e intestazioni. Ha un'identita' molto diversa da
    # Inter (a'Rundata, forme larghe), ed e' quello che distingue l'app da un
    # tema Material qualsiasi.
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGroteskVar.ttf
        - asset: assets/fonts/SpaceGroteskVar.ttf
          weight: 400
        - asset: assets/fonts/SpaceGroteskVar.ttf
          weight: 500
        - asset: assets/fonts/SpaceGroteskVar.ttf
          weight: 600
        - asset: assets/fonts/SpaceGroteskVar.ttf
          weight: 700
