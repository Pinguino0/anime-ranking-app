org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# `org.chromium.net:cronet-api` e `:cronet-shared` (portati da `cronet_http`)
# dichiarano lo stesso namespace `org.chromium.net`, e da AGP 8 il controllo
# sui namespace duplicati fa fallire il merge del manifest. Le due librerie
# sono moduli distinti e non si sovrappongono a runtime: il conflitto e'
# noto e risale da tempo a dart-lang/http#1932, che segnala lo stesso
# workaround.
android.uniquePackageNames=false
