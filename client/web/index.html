<!DOCTYPE html>
<html>
<head>
  <!--
    Path di base: sostituito da `--base-href` durante `flutter build web`.
    Deve iniziare e finire con "/" per funzionare correttamente.
    https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AnimeRank — scopri, vota e classifica gli anime insieme ai tuoi amici.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05050A">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AnimeRank">

  <!-- iOS: icona nella home (serve un file reale, non maskable) -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>AnimeRank</title>

  <!-- Stile durante il caricamento: evita lo schermo bianco prima che Flutter parta -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #05050A;
      height: 100%;
      overflow: hidden;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #05050A;
      z-index: 9999;
      transition: opacity .3s ease;
    }
    #splash img { width: 96px; height: 96px; }
    #splash.hide { opacity: 0; pointer-events: none; }

    /* Avviso "nuova versione" — stessa lingua visiva dell'app. */
    #update-banner {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      z-index: 10000;
      display: none;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      background: #14141F;
      border: 1px solid #2A2A3D;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .5);
      color: #F2F2F7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
    }
    #update-banner.show { display: flex; }
    #update-banner .msg { flex: 1; line-height: 1.35; }
    #update-banner button {
      flex: none;
      padding: 8px 14px;
      border: 0;
      border-radius: 10px;
      background: #7C4DFF;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Splash visibile finché Flutter non ha montato il primo frame -->
  <div id="splash"><img src="icons/Icon-192.png" alt=""></div>

  <!-- Avviso di aggiornamento (riempito via JavaScript) -->
  <div id="update-banner" role="status" aria-live="polite">
    <span class="msg">È pronta una nuova versione di AnimeRank.</span>
    <button type="button" id="update-btn">Aggiorna</button>
  </div>

  <!--
    flutter_bootstrap.js carica Flutter. Il service worker lo registra lo
    script qui sotto: il bootstrap di Flutter non ne registra uno suo (vedi
    `web/flutter_bootstrap.js`), altrimenti i due si sovrascriverebbero.
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- PWA: service worker + avviso "nuova versione" -->
  <script>
    (function () {
      // Nasconde lo splash appena Flutter ha montato il primo frame.
      window.addEventListener('flutter-first-frame', function () {
        var splash = document.getElementById('splash');
        if (splash) splash.classList.add('hide');
        setTimeout(function () { if (splash) splash.remove(); }, 400);
      });

      if (!('serviceWorker' in navigator)) return;

      var banner = document.getElementById('update-banner');
      var button = document.getElementById('update-btn');
      var waitingWorker = null;
      var reloading = false;

      function showUpdate(worker) {
        waitingWorker = worker;
        if (banner) banner.classList.add('show');
      }

      if (button) {
        button.addEventListener('click', function () {
          if (waitingWorker) {
            waitingWorker.postMessage({ type: 'SKIP_WAITING' });
          }
          if (banner) banner.classList.remove('show');
        });
      }

      // Quando il nuovo worker prende il controllo, si ricarica una volta sola
      // per far partire il codice aggiornato.
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (reloading) return;
        reloading = true;
        window.location.reload();
      });

      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (registration) {
          // C'è già un worker in attesa (es. app rimasta aperta da prima).
          if (registration.waiting && navigator.serviceWorker.controller) {
            showUpdate(registration.waiting);
          }

          registration.addEventListener('updatefound', function () {
            var installing = registration.installing;
            if (!installing) return;
            installing.addEventListener('statechange', function () {
              if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                showUpdate(installing);
              }
            });
          });
        }).catch(function (error) {
          console.warn('Registrazione service worker fallita:', error);
        });
      });
    })();
  </script>
</body>
</html>
